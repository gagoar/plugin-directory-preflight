<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Plugin Directory Preflight</title><style>
@font-face{font-family:"Barlow Condensed";font-weight:600;src:url("fonts/barlow-condensed-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:400;src:url("fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2")}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:630px;background:#101418;color:#e9eef2;font-family:"IBM Plex Mono",monospace;padding:64px 80px;position:relative;overflow:hidden}
.l{font-family:"Barlow Condensed",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.16em;font-size:26px;color:#f5a524;display:flex;align-items:center;gap:14px}
.lamp{width:18px;height:18px;border-radius:50%;background:#f5a524;box-shadow:0 0 0 4px #6b4a12,0 0 20px rgba(245,165,36,.6)}
h1{font-family:"Barlow Condensed",sans-serif;font-weight:600;text-transform:uppercase;font-size:104px;line-height:.98;margin:18px 0 16px;max-width:780px}
p{font-size:26px;line-height:1.4;color:#a3b0bb;max-width:640px}
.run{position:absolute;left:0;right:0;bottom:96px;border-top:5px dashed #6b4a12}
.cmd{position:absolute;left:80px;bottom:44px;font-size:24px;color:#a3b0bb}
.ro{position:absolute;right:80px;top:80px;width:260px;background:#171d23;border:2px solid #2d3741;border-radius:8px;padding:22px 26px}
.ro .t{font-family:"Barlow Condensed",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.16em;font-size:22px;color:#a3b0bb;display:flex;align-items:center;gap:10px}
.ro .n{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:150px;line-height:1;color:#f5a524}
.ro .g{color:#3ddc84}.ro .lamp.g{background:#3ddc84;box-shadow:0 0 0 4px #17482c,0 0 20px rgba(61,220,132,.6)}
.ro hr{border:0;border-top:2px solid #2d3741;margin:8px 0 14px}
.ro .n.sm{font-size:150px}
</style></head><body>
<div class="l"><span class="lamp"></span>Claude Code plugin</div>
<h1>Plugin Directory<br>Preflight</h1>
<p>Know what the directory scan will hold, before you upload.</p>
<div class="ro" role="img" aria-label="Gate run: 3 problems before the fix, 0 after">
<div class="t"><span class="lamp" style="width:14px;height:14px"></span>Before</div><div class="n">3</div><hr>
<div class="t"><span class="lamp g" style="width:14px;height:14px"></span>After</div><div class="n g">0</div>
</div>
<div class="run"></div>
<div class="cmd">/plugin marketplace add gagoar/plugin-directory-preflight</div>
</body></html>
